name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "**" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
  # Actions caches are branch-scoped: PR runs can only restore caches created on
  # the same PR or on main. The post-merge run on main is what seeds the sccache
  # cache every new PR warm-starts from.
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'

# A force-push supersedes the in-flight run for the same PR; cancel it.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Heavy worldgen tests live in tests-heavy.yml, path-gated to worldgen changes
# (libs/world, libs/foundation, vcpkg.json, root CMakeLists) with a nightly
# backstop run. This workflow is the always-on fast gate.
jobs:
  test:
    # Skip while the PR is a draft; re-runs when marked ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make cmake clang \
          libxmu-dev libxi-dev libgl-dev libxrandr-dev libxinerama-dev \
          libxcursor-dev libx11-dev

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '8f54ef5453e7e76ff01e15988bf243e7247c5eb5'

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DBUILD_TESTING=ON
      env:
        CC: clang
        CXX: clang++

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: sccache stats
      run: sccache --show-stats

    # Gating step: every unit-test target except benchmarks and the heavy
    # worldgen bucket (which runs in tests-heavy.yml). -j4 matches the runner's
    # cores; the per-lib test exes are independent.
    - name: Run fast tests
      run: |
        cd build
        ctest -j4 --output-on-failure -E "(benchmarks|world-tests-heavy)"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/Testing/
        retention-days: 7

  test-windows:
    # Skip while the PR is a draft; re-runs when marked ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Ninja needs cl.exe on PATH (the VS generator found MSVC itself, but it
    # cannot run compiler launchers, which sccache requires).
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        # Windows builds ports from source when the binary cache is cold, and the
        # older tool commit's msys2 packages (pkgconf, via vcpkg_fixup_pkgconfig)
        # are gone from every mirror. Newer tool scripts; ports stay on the
        # vcpkg.json builtin-baseline.
        vcpkgGitCommitId: '617ef1c0c422737d117eda00a471ea1be5bad088'

    # CMP0141=NEW + Embedded selects /Z7 debug info; sccache cannot cache /Zi
    # compilations. BUILD_DEVELOPER_CLIENT=OFF keeps the npm web-app build out
    # of this job (it never ran here under the VS generator, where
    # CMAKE_BUILD_TYPE is empty).
    - name: Configure CMake
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=cl \
          -DCMAKE_CXX_COMPILER=cl \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
          -DBUILD_DEVELOPER_CLIENT=OFF \
          -DBUILD_TESTING=ON

    - name: Build
      shell: bash
      run: cmake --build build

    - name: sccache stats
      shell: bash
      run: sccache --show-stats

    # Single-config Ninja: no -C Debug needed.
    - name: Run fast tests
      shell: bash
      run: |
        cd build
        ctest -j4 --output-on-failure -E "(benchmarks|world-tests-heavy)"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows
        path: build/Testing/
        retention-days: 7
