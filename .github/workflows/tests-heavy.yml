name: Tests (heavy worldgen)

# The heavy bucket (full PlanetGenerator pipelines, PlateSim histories) is the
# most expensive CI step by far, and worldgen changes at a different cadence
# than game code. So it runs only when worldgen inputs change, plus a nightly
# run on main as the backstop for anything the path filter misses (toolchain
# drift, indirect golden-hash breakage).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "**" ]
    paths:
      - 'libs/world/**'
      - 'libs/foundation/**'
      - 'vcpkg.json'
      - 'CMakeLists.txt'
      - '.github/workflows/tests-heavy.yml'
  schedule:
    - cron: '0 8 * * *'  # nightly on main
  workflow_dispatch:

concurrency:
  group: tests-heavy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-heavy:
    # Draft-skip applies only to PR events; nightly/dispatch always run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make cmake clang \
          libxmu-dev libxi-dev libgl-dev libxrandr-dev libxinerama-dev \
          libxcursor-dev libx11-dev

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '8f54ef5453e7e76ff01e15988bf243e7247c5eb5'

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DBUILD_TESTING=ON
      env:
        CC: clang
        CXX: clang++

    # Only the heavy bucket's executable, not the whole tree.
    - name: Build world-tests
      run: cmake --build build --target world-tests -j$(nproc)

    - name: sccache stats
      run: sccache --show-stats

    # 4 gtest shards registered in libs/world/CMakeLists.txt; -j4 runs them
    # concurrently on the 4-core runner.
    - name: Run heavy worldgen tests
      run: |
        cd build
        ctest -j4 --output-on-failure -L heavy

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-heavy
        path: build/Testing/
        retention-days: 7

  test-heavy-windows:
    # Draft-skip applies only to PR events; nightly/dispatch always run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '8f54ef5453e7e76ff01e15988bf243e7247c5eb5'

    - name: Configure CMake
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=cl \
          -DCMAKE_CXX_COMPILER=cl \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
          -DBUILD_DEVELOPER_CLIENT=OFF \
          -DBUILD_TESTING=ON

    - name: Build world-tests
      shell: bash
      run: cmake --build build --target world-tests

    - name: sccache stats
      shell: bash
      run: sccache --show-stats

    - name: Run heavy worldgen tests
      shell: bash
      run: |
        cd build
        ctest -j4 --output-on-failure -L heavy

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-heavy-windows
        path: build/Testing/
        retention-days: 7
