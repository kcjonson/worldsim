<?xml version="1.0" encoding="UTF-8"?>
<!-- Packaging crate, back layer: the side-view crate's back wall and interior, drawn behind the
     packaged item. The front layer (packaging_crate_front.svg) draws over the item.
     Both layers span exactly 0..100 x 0..75 (1.0 m x 0.75 m at worldHeight 0.75) so they
     register; PackagedLayout.h's crate constants are these coordinates / 100. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 75" width="100" height="75">
  <g id="outline">
    <rect x="0" y="0" width="100" height="75" fill="#3a2a20"/>
  </g>
  <g id="back-wall">
    <rect x="1.5" y="1.5" width="97" height="3.5" fill="#9b8365"/>
    <rect x="3" y="5" width="94" height="68.5" fill="#4a3628"/>
    <rect x="5" y="9" width="90" height="13" fill="#6b5344"/>
    <rect x="5" y="25" width="90" height="13" fill="#634b3c"/>
    <rect x="5" y="41" width="90" height="13" fill="#6b5344"/>
    <rect x="5" y="57" width="90" height="10" fill="#634b3c"/>
  </g>
  <g id="floor">
    <rect x="3" y="67" width="94" height="6.5" fill="#8b7355"/>
  </g>
</svg>
