<?xml version="1.0" encoding="UTF-8"?>
<!-- Packaging crate, front layer: corner posts and the low front slats, drawn over the packaged
     item so it reads as sitting inside (the item shows above the slats and through the gap).
     Same 0..100 x 0..75 frame as packaging_crate.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 75" width="100" height="75">
  <g id="slats">
    <rect x="8" y="45" width="84" height="13" fill="#3a2a20"/>
    <rect x="8" y="46.5" width="84" height="10" fill="#a08868"/>
    <rect x="8" y="53.5" width="84" height="3" fill="#8b7355"/>
    <rect x="8" y="61" width="84" height="14" fill="#3a2a20"/>
    <rect x="8" y="62.5" width="84" height="11" fill="#8b7355"/>
    <rect x="8" y="70" width="84" height="3.5" fill="#6b5344"/>
    <rect x="26" y="49" width="16" height="1.2" fill="#7b6355"/>
    <rect x="58" y="51" width="20" height="1.2" fill="#7b6355"/>
    <rect x="36" y="66" width="22" height="1.2" fill="#6b5344"/>
  </g>
  <g id="posts">
    <rect x="0" y="0" width="9.5" height="75" fill="#3a2a20"/>
    <rect x="1.5" y="1.5" width="6.5" height="72" fill="#8b7355"/>
    <rect x="1.5" y="1.5" width="2.5" height="72" fill="#a08868"/>
    <rect x="90.5" y="0" width="9.5" height="75" fill="#3a2a20"/>
    <rect x="92" y="1.5" width="6.5" height="72" fill="#6b5344"/>
    <rect x="96" y="1.5" width="2.5" height="72" fill="#5b4334"/>
  </g>
  <g id="nails">
    <rect x="11" y="50" width="2" height="2" fill="#3a2a20"/>
    <rect x="87" y="50" width="2" height="2" fill="#3a2a20"/>
    <rect x="11" y="66.5" width="2" height="2" fill="#3a2a20"/>
    <rect x="87" y="66.5" width="2" height="2" fill="#3a2a20"/>
  </g>
</svg>
